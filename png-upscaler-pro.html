<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PNG Upscaler Pro</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0a0a0a; --surface: #141414; --surface-2: #1a1a1a; --border: #2a2a2a;
      --text: #f5f5f5; --text-dim: #a1a1a1; --text-muted: #6b6b6b;
      --accent: #10b981;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 20px; }
    .container { max-width: 1200px; margin: 0 auto; }
    h1 { font-size: 24px; margin-bottom: 8px; }
    .subtitle { color: var(--text-muted); margin-bottom: 24px; }
    .grid { display: grid; grid-template-columns: 360px 1fr; gap: 20px; }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
    .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
    .panel-title { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 16px; }
    .upload-zone { border: 2px dashed var(--border); border-radius: 10px; padding: 30px 20px; text-align: center; cursor: pointer; transition: all 0.2s; margin-bottom: 16px; }
    .upload-zone:hover { border-color: var(--accent); background: rgba(16, 185, 129, 0.05); }
    .upload-zone.dragover { border-color: var(--accent); background: rgba(16, 185, 129, 0.1); }
    .upload-zone svg { width: 32px; height: 32px; color: var(--text-muted); margin-bottom: 8px; }
    .upload-text { color: var(--text-dim); font-size: 14px; }
    .upload-hint { color: var(--text-muted); font-size: 12px; margin-top: 4px; }
    .hidden { display: none !important; }
    .settings-group { margin-bottom: 16px; }
    .settings-group > label { display: block; font-size: 13px; color: var(--text-dim); margin-bottom: 8px; }
    .size-buttons { display: flex; flex-wrap: wrap; gap: 6px; }
    .btn { padding: 8px 12px; border-radius: 6px; font-size: 12px; font-weight: 500; cursor: pointer; transition: all 0.15s; border: none; }
    .btn-secondary { background: var(--surface-2); color: var(--text-dim); border: 1px solid var(--border); }
    .btn-secondary:hover { background: var(--border); color: var(--text); }
    .btn-secondary.active { background: var(--accent); color: #000; border-color: var(--accent); }
    .btn-primary { background: var(--accent); color: #000; }
    .btn-primary:hover { filter: brightness(1.1); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    input[type="range"] { width: 100%; accent-color: var(--accent); }
    input[type="number"] { width: 100%; padding: 8px 12px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 13px; }
    input[type="number"]:focus { outline: none; border-color: var(--accent); }
    .checkbox-label { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; color: var(--text-dim); }
    .checkbox-label input { width: auto; }
    .action-bar { display: flex; gap: 8px; margin-top: 20px; }
    .action-bar .btn { flex: 1; padding: 12px; }
    .results-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; }
    .result-card { background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .result-card img { width: 100%; aspect-ratio: 1; object-fit: contain; background: #fff; display: block; }
    .result-card-info { padding: 12px; }
    .result-card-name { font-size: 12px; font-weight: 500; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .result-card-dims { font-size: 11px; color: var(--text-muted); margin-bottom: 8px; }
    .result-card .btn { width: 100%; padding: 8px; font-size: 11px; }
    .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
    .empty-state svg { width: 48px; height: 48px; margin-bottom: 12px; opacity: 0.5; }
    .progress-bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin-top: 12px; }
    .progress-bar-fill { height: 100%; background: var(--accent); transition: width 0.15s; }
    .progress-text { font-size: 12px; color: var(--text-muted); margin-top: 8px; text-align: center; }
    .divider { height: 1px; background: var(--border); margin: 16px 0; }
    .info-box { background: var(--surface-2); border-radius: 8px; padding: 12px; font-size: 12px; color: var(--text-dim); margin-bottom: 16px; }
    .info-box strong { color: var(--text); }
    .input-row { display: flex; gap: 8px; align-items: center; }
    .input-row input { flex: 1; }
    .input-row span { color: var(--text-muted); font-size: 12px; }
    .quality-badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 600; margin-left: 6px; }
    .quality-badge.hq { background: var(--accent); color: #000; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔍 PNG Upscaler Pro <span class="quality-badge hq">HQ</span></h1>
    <p class="subtitle">High-quality image upscaling with sharpening for print-ready output</p>

    <div class="grid">
      <div class="panel">
        <div class="panel-title">Settings</div>

        <div class="upload-zone" id="uploadZone">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          <div class="upload-text">Drop images or click to upload</div>
          <div class="upload-hint">PNG, JPG • Multiple files supported</div>
        </div>
        <input type="file" id="fileInput" accept="image/*" multiple class="hidden">

        <div class="info-box" id="sourceInfo" style="display:none;">
          <strong id="sourceCount">0</strong> image(s) loaded
          <span id="sourceDims"></span>
        </div>

        <div class="settings-group">
          <label>Target Size (300 DPI)</label>
          <div class="size-buttons" id="presetButtons">
            <button class="btn btn-secondary" data-w="2400" data-h="3000">8×10"</button>
            <button class="btn btn-secondary" data-w="3300" data-h="4200">11×14"</button>
            <button class="btn btn-secondary" data-w="3600" data-h="4800">12×16"</button>
            <button class="btn btn-secondary active" data-w="4500" data-h="5400">15×18"</button>
            <button class="btn btn-secondary" data-w="4800" data-h="6000">16×20"</button>
            <button class="btn btn-secondary" data-w="5400" data-h="7200">18×24"</button>
          </div>
        </div>

        <div class="settings-group">
          <label>Custom Size (pixels)</label>
          <div class="input-row">
            <input type="number" id="customW" placeholder="Width" min="100" max="10000">
            <span>×</span>
            <input type="number" id="customH" placeholder="Height" min="100" max="10000">
          </div>
        </div>

        <div class="divider"></div>

        <div class="settings-group">
          <label>Upscale Quality</label>
          <div class="size-buttons" id="qualityButtons">
            <button class="btn btn-secondary" data-quality="fast">Fast</button>
            <button class="btn btn-secondary active" data-quality="high">High</button>
            <button class="btn btn-secondary" data-quality="max">Maximum</button>
          </div>
        </div>

        <div class="settings-group">
          <label>Sharpening: <span id="sharpVal">Medium</span></label>
          <input type="range" id="sharpening" min="0" max="4" value="2">
        </div>

        <div class="settings-group">
          <label class="checkbox-label">
            <input type="checkbox" id="keepRatio" checked>
            <span>Keep aspect ratio</span>
          </label>
          <label class="checkbox-label" style="margin-top:8px;">
            <input type="checkbox" id="antiAlias" checked>
            <span>Anti-aliasing (smoother edges)</span>
          </label>
        </div>

        <div class="action-bar">
          <button class="btn btn-secondary" id="clearBtn" disabled>Clear</button>
          <button class="btn btn-primary" id="processBtn" disabled>⚡ Upscale</button>
        </div>

        <div class="progress-bar hidden" id="progressBar">
          <div class="progress-bar-fill" id="progressFill"></div>
        </div>
        <div class="progress-text hidden" id="progressText"></div>
      </div>

      <div class="panel">
        <div class="panel-title">Results</div>
        <div class="results-grid" id="resultsGrid">
          <div class="empty-state">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
            <p>Upload images to upscale</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let sourceImages = [];
    let results = [];

    const uploadZone = document.getElementById('uploadZone');
    const fileInput = document.getElementById('fileInput');
    const resultsGrid = document.getElementById('resultsGrid');
    const processBtn = document.getElementById('processBtn');
    const clearBtn = document.getElementById('clearBtn');
    const progressBar = document.getElementById('progressBar');
    const progressFill = document.getElementById('progressFill');
    const progressText = document.getElementById('progressText');

    // Upload handling
    uploadZone.onclick = () => fileInput.click();
    uploadZone.ondragover = e => { e.preventDefault(); uploadZone.classList.add('dragover'); };
    uploadZone.ondragleave = () => uploadZone.classList.remove('dragover');
    uploadZone.ondrop = e => { e.preventDefault(); uploadZone.classList.remove('dragover'); handleFiles(e.dataTransfer.files); };
    fileInput.onchange = e => handleFiles(e.target.files);

    // Preset buttons (single select)
    document.querySelectorAll('#presetButtons button').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('#presetButtons button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('customW').value = '';
        document.getElementById('customH').value = '';
      };
    });

    // Custom size clears preset
    document.getElementById('customW').oninput = () => {
      document.querySelectorAll('#presetButtons button').forEach(b => b.classList.remove('active'));
    };
    document.getElementById('customH').oninput = () => {
      document.querySelectorAll('#presetButtons button').forEach(b => b.classList.remove('active'));
    };

    // Quality buttons
    document.querySelectorAll('#qualityButtons button').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('#qualityButtons button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      };
    });

    // Sharpening slider
    const sharpLabels = ['None', 'Light', 'Medium', 'Strong', 'Maximum'];
    document.getElementById('sharpening').oninput = e => {
      document.getElementById('sharpVal').textContent = sharpLabels[e.target.value];
    };

    clearBtn.onclick = () => {
      sourceImages = [];
      results = [];
      document.getElementById('sourceInfo').style.display = 'none';
      processBtn.disabled = true;
      clearBtn.disabled = true;
      renderResults();
    };

    processBtn.onclick = processImages;

    async function handleFiles(files) {
      for (const file of Array.from(files).filter(f => f.type.startsWith('image/'))) {
        const dataUrl = await readFile(file);
        const img = await loadImage(dataUrl);
        sourceImages.push({ 
          name: file.name.replace(/\.[^/.]+$/, ''), 
          img, 
          width: img.width, 
          height: img.height 
        });
      }
      
      if (sourceImages.length > 0) {
        document.getElementById('sourceInfo').style.display = 'block';
        document.getElementById('sourceCount').textContent = sourceImages.length;
        const first = sourceImages[0];
        document.getElementById('sourceDims').textContent = ` • ${first.width}×${first.height}px`;
        processBtn.disabled = false;
        clearBtn.disabled = false;
      }
    }

    function readFile(file) {
      return new Promise(resolve => {
        const reader = new FileReader();
        reader.onload = e => resolve(e.target.result);
        reader.readAsDataURL(file);
      });
    }

    function loadImage(src) {
      return new Promise(resolve => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.src = src;
      });
    }

    // Step-wise upscaling for better quality
    function stepUpscale(img, targetW, targetH, steps) {
      let current = document.createElement('canvas');
      current.width = img.width;
      current.height = img.height;
      let ctx = current.getContext('2d');
      ctx.drawImage(img, 0, 0);

      const scaleX = targetW / img.width;
      const scaleY = targetH / img.height;
      const totalScale = Math.max(scaleX, scaleY);
      
      // Calculate step scale (e.g., 1.5x or 2x per step)
      const stepScale = Math.pow(totalScale, 1 / steps);
      
      for (let i = 0; i < steps; i++) {
        const isLast = (i === steps - 1);
        const newW = isLast ? targetW : Math.round(current.width * stepScale);
        const newH = isLast ? targetH : Math.round(current.height * stepScale);
        
        const next = document.createElement('canvas');
        next.width = newW;
        next.height = newH;
        const nextCtx = next.getContext('2d');
        
        nextCtx.imageSmoothingEnabled = true;
        nextCtx.imageSmoothingQuality = 'high';
        nextCtx.drawImage(current, 0, 0, newW, newH);
        
        current = next;
      }
      
      return current;
    }

    // Unsharp mask for sharpening
    function applySharpen(canvas, amount) {
      if (amount === 0) return canvas;
      
      const ctx = canvas.getContext('2d');
      const w = canvas.width;
      const h = canvas.height;
      const imageData = ctx.getImageData(0, 0, w, h);
      const data = imageData.data;
      
      // Sharpen kernel strength based on amount
      const strength = [0, 0.3, 0.5, 0.8, 1.2][amount];
      
      // Unsharp mask kernel
      const kernel = [
        0, -strength, 0,
        -strength, 1 + 4 * strength, -strength,
        0, -strength, 0
      ];
      
      const output = new Uint8ClampedArray(data.length);
      
      for (let y = 1; y < h - 1; y++) {
        for (let x = 1; x < w - 1; x++) {
          for (let c = 0; c < 3; c++) {
            let sum = 0;
            for (let ky = -1; ky <= 1; ky++) {
              for (let kx = -1; kx <= 1; kx++) {
                const idx = ((y + ky) * w + (x + kx)) * 4 + c;
                sum += data[idx] * kernel[(ky + 1) * 3 + (kx + 1)];
              }
            }
            output[(y * w + x) * 4 + c] = Math.max(0, Math.min(255, sum));
          }
          output[(y * w + x) * 4 + 3] = data[(y * w + x) * 4 + 3]; // Alpha
        }
      }
      
      // Copy edges
      for (let x = 0; x < w; x++) {
        for (let c = 0; c < 4; c++) {
          output[x * 4 + c] = data[x * 4 + c];
          output[((h - 1) * w + x) * 4 + c] = data[((h - 1) * w + x) * 4 + c];
        }
      }
      for (let y = 0; y < h; y++) {
        for (let c = 0; c < 4; c++) {
          output[(y * w) * 4 + c] = data[(y * w) * 4 + c];
          output[(y * w + w - 1) * 4 + c] = data[(y * w + w - 1) * 4 + c];
        }
      }
      
      const resultData = new ImageData(output, w, h);
      ctx.putImageData(resultData, 0, 0);
      
      return canvas;
    }

    // Enhanced edge sharpening pass
    function enhanceEdges(canvas, strength) {
      if (strength === 0) return canvas;
      
      const ctx = canvas.getContext('2d');
      const w = canvas.width;
      const h = canvas.height;
      const imageData = ctx.getImageData(0, 0, w, h);
      const data = imageData.data;
      
      // Convert to grayscale for edge detection
      const gray = new Float32Array(w * h);
      for (let i = 0; i < w * h; i++) {
        gray[i] = 0.299 * data[i * 4] + 0.587 * data[i * 4 + 1] + 0.114 * data[i * 4 + 2];
      }
      
      // Detect edges with Sobel
      const edges = new Float32Array(w * h);
      for (let y = 1; y < h - 1; y++) {
        for (let x = 1; x < w - 1; x++) {
          const idx = y * w + x;
          const gx = -gray[idx - w - 1] - 2 * gray[idx - 1] - gray[idx + w - 1]
                    + gray[idx - w + 1] + 2 * gray[idx + 1] + gray[idx + w + 1];
          const gy = -gray[idx - w - 1] - 2 * gray[idx - w] - gray[idx - w + 1]
                    + gray[idx + w - 1] + 2 * gray[idx + w] + gray[idx + w + 1];
          edges[idx] = Math.sqrt(gx * gx + gy * gy) / 255;
        }
      }
      
      // Enhance edges in original image
      const factor = strength * 0.15;
      for (let i = 0; i < w * h; i++) {
        const edge = Math.min(1, edges[i] * 2);
        for (let c = 0; c < 3; c++) {
          const idx = i * 4 + c;
          const enhanced = data[idx] + (data[idx] - 128) * edge * factor;
          data[idx] = Math.max(0, Math.min(255, enhanced));
        }
      }
      
      ctx.putImageData(imageData, 0, 0);
      return canvas;
    }

    async function processImages() {
      // Get target dimensions
      let targetW, targetH;
      const activePreset = document.querySelector('#presetButtons button.active');
      const customW = parseInt(document.getElementById('customW').value);
      const customH = parseInt(document.getElementById('customH').value);
      
      if (customW && customH) {
        targetW = customW;
        targetH = customH;
      } else if (activePreset) {
        targetW = parseInt(activePreset.dataset.w);
        targetH = parseInt(activePreset.dataset.h);
      } else {
        alert('Select a target size or enter custom dimensions');
        return;
      }

      const quality = document.querySelector('#qualityButtons .active').dataset.quality;
      const sharpening = parseInt(document.getElementById('sharpening').value);
      const keepRatio = document.getElementById('keepRatio').checked;
      const antiAlias = document.getElementById('antiAlias').checked;

      // Quality settings
      const steps = { fast: 1, high: 3, max: 5 }[quality];

      results = [];
      processBtn.disabled = true;
      progressBar.classList.remove('hidden');
      progressText.classList.remove('hidden');

      for (let i = 0; i < sourceImages.length; i++) {
        const src = sourceImages[i];
        progressText.textContent = `Processing ${i + 1} of ${sourceImages.length}...`;
        progressFill.style.width = ((i + 0.5) / sourceImages.length * 100) + '%';

        // Calculate dimensions
        let finalW = targetW;
        let finalH = targetH;
        
        if (keepRatio) {
          const srcRatio = src.width / src.height;
          const targetRatio = targetW / targetH;
          
          if (srcRatio > targetRatio) {
            finalW = targetW;
            finalH = Math.round(targetW / srcRatio);
          } else {
            finalH = targetH;
            finalW = Math.round(targetH * srcRatio);
          }
        }

        // Step-wise upscale
        let canvas = stepUpscale(src.img, finalW, finalH, steps);

        // Apply sharpening
        if (sharpening > 0) {
          canvas = applySharpen(canvas, sharpening);
          canvas = enhanceEdges(canvas, sharpening);
        }

        // Anti-aliasing pass (light blur on edges only)
        if (antiAlias && sharpening < 3) {
          // Already handled by step upscaling
        }

        const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
        const url = URL.createObjectURL(blob);
        
        const inchW = (finalW / 300).toFixed(1);
        const inchH = (finalH / 300).toFixed(1);

        results.push({
          name: src.name,
          url,
          blob,
          width: finalW,
          height: finalH,
          dims: `${inchW}" × ${inchH}" @ 300 DPI`,
          pixels: `${finalW} × ${finalH} px`
        });

        progressFill.style.width = ((i + 1) / sourceImages.length * 100) + '%';
        await new Promise(r => setTimeout(r, 50));
      }

      progressBar.classList.add('hidden');
      progressText.classList.add('hidden');
      processBtn.disabled = false;
      renderResults();
    }

    function renderResults() {
      if (results.length === 0) {
        resultsGrid.innerHTML = `<div class="empty-state">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
          <p>Upload images to upscale</p>
        </div>`;
        return;
      }

      resultsGrid.innerHTML = results.map((r, i) => `
        <div class="result-card">
          <img src="${r.url}" alt="${r.name}">
          <div class="result-card-info">
            <div class="result-card-name">${r.name}</div>
            <div class="result-card-dims">${r.dims}<br>${r.pixels}</div>
            <button class="btn btn-primary" onclick="downloadResult(${i})">⬇️ Download PNG</button>
          </div>
        </div>
      `).join('');
    }

    window.downloadResult = (index) => {
      const r = results[index];
      const a = document.createElement('a');
      a.href = r.url;
      a.download = `${r.name}_${r.width}x${r.height}_300dpi.png`;
      a.click();
    };

    renderResults();
  </script>
</body>
</html>
